name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Build web
        # "/finix/" debe coincidir con el nombre del repositorio (barra al inicio y al final)
        run: |
          flutter build web --release \
            --base-href "/finix/" \
            --dart-define=API_URL=${{ vars.API_URL }}

      - name: Fallback para rutas (SPA)
        run: cp build/web/index.html build/web/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
